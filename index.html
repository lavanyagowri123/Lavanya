<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Still Space</title>
  <meta name="theme-color" content="#faf5ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #faf5ef;
      color: #2c1f14;
      font-family: 'Georgia', 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 52px 24px 64px;
      gap: 48px;
    }

    header { text-align: center; }

    .hero-dot {
      width: 7px; height: 7px;
      background: #c4956a;
      border-radius: 50%;
      margin: 0 auto 22px;
      opacity: 0.5;
    }
    .hero-title {
      font-size: 1.8rem;
      font-weight: normal;
      letter-spacing: 0.22em;
      color: #6b4c2a;
      margin-bottom: 10px;
    }
    .tagline {
      font-size: 0.75rem;
      color: #a89070;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 340px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 22px 20px;
      border-radius: 18px;
      border: 1px solid transparent;
      text-decoration: none;
      color: inherit;
      transition: transform 0.14s ease, opacity 0.14s ease;
      cursor: pointer;
    }
    .card:active { transform: scale(0.972); opacity: 0.85; }

    .card-w {
      background: #fdf0e8;
      border-color: rgba(192,90,52,0.16);
    }
    .card-m {
      background: #fdf5e6;
      border-color: rgba(175,125,42,0.16);
    }
    .card-j {
      background: #edf2f9;
      border-color: rgba(65,108,155,0.14);
    }

    .card-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
      width: 28px;
      text-align: center;
      line-height: 1;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="hero-dot"></div>
      <h1 class="hero-title">Still Space</h1>
      <div id="streak-wrap" style="display:none;font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;color:#c4956a;margin-bottom:10px"></div>
      <p class="tagline" id="tagline">Take care of yourself first.</p>
    </header>

    <div class="cards">
      <a href="/workout" class="card card-w">
        <div class="card-icon" id="icon-move">◈</div>
        <div class="card-body">
          <div class="card-title">Move</div>
        </div>
      </a>

      <a href="/meditation" class="card card-m">
        <div class="card-icon" id="icon-med">✶</div>
        <div class="card-body">
          <div class="card-title">Meditate</div>
        </div>
      </a>

      <a href="/journal" class="card card-j">
        <div class="card-icon" id="icon-mirror">✦</div>
        <div class="card-body">
          <div class="card-title">Mirror</div>
        </div>
      </a>
    </div>
  </div>

  <script>
    (function () {
      function getMelbDateISO() {
        return new Date().toLocaleDateString('sv', { timeZone: 'Australia/Melbourne' });
      }
      var today = getMelbDateISO();

      // Read done state
      var done = { move: false, meditate: false, mirror: false };
      try {
        var raw = JSON.parse(localStorage.getItem('stillspace_done') || '{}');
        if (raw.date === today) { done.move = !!raw.move; done.meditate = !!raw.meditate; done.mirror = !!raw.mirror; }
      } catch(e) {}

      // Read streak (only show if current — today or yesterday)
      var streakCount = 0;
      try {
        var s = JSON.parse(localStorage.getItem('stillspace_streak') || '{}');
        if (s.count) {
          var prev = new Date(today + 'T00:00:00');
          prev.setDate(prev.getDate() - 1);
          var yesterday = prev.toISOString().slice(0, 10);
          if (s.lastDate === today || s.lastDate === yesterday) streakCount = s.count;
        }
      } catch(e) {}

      // Completion ticks
      function tick(id) {
        var el = document.getElementById(id);
        if (el) { el.textContent = '✓'; el.style.color = '#c4956a'; el.style.opacity = '1'; }
      }
      if (done.move)     tick('icon-move');
      if (done.meditate) tick('icon-med');
      if (done.mirror)   tick('icon-mirror');

      // Tagline celebration
      var allDone = done.move && done.meditate && done.mirror;
      if (allDone) {
        var tl = document.getElementById('tagline');
        if (tl) tl.textContent = 'You showed up today ✦';
      }

      // Streak badge
      if (streakCount > 0) {
        var sw = document.getElementById('streak-wrap');
        if (sw) {
          sw.textContent = streakCount + ' day' + (streakCount !== 1 ? 's' : '') + ' in a row ✦';
          sw.style.display = 'block';
        }
      }
    })();
  </script>
</body>
</html>

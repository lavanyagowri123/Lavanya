<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Still Space</title>
  <meta name="theme-color" content="#faf5ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #faf5ef;
      color: #2c1f14;
      font-family: 'Georgia', 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 52px 24px 64px;
      gap: 48px;
    }

    header { text-align: center; }

    .hero-dot {
      width: 7px; height: 7px;
      background: #c4956a;
      border-radius: 50%;
      margin: 0 auto 22px;
      opacity: 0.5;
    }
    .hero-title {
      font-size: 1.8rem;
      font-weight: normal;
      letter-spacing: 0.22em;
      color: #6b4c2a;
      margin-bottom: 10px;
    }
    .tagline {
      font-size: 0.75rem;
      color: #a89070;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 340px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 22px 20px;
      border-radius: 18px;
      border: 1px solid transparent;
      text-decoration: none;
      color: inherit;
      transition: transform 0.14s ease, opacity 0.14s ease;
      cursor: pointer;
    }
    .card:active { transform: scale(0.972); opacity: 0.85; }

    .card-w {
      background: #fdf0e8;
      border-color: rgba(192,90,52,0.16);
    }
    .card-m {
      background: #fdf5e6;
      border-color: rgba(175,125,42,0.16);
    }
    .card-j {
      background: #edf2f9;
      border-color: rgba(65,108,155,0.14);
    }

    .card-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
      width: 28px;
      text-align: center;
      line-height: 1;
      opacity: 0.7;
    }

    .card-body { flex: 1; }

    .card-title {
      font-size: 1.05rem;
      font-weight: normal;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }
    .card-w .card-title { color: #b04828; }
    .card-m .card-title { color: #8a6218; }
    .card-j .card-title { color: #345e82; }

    .card-desc {
      font-size: 0.72rem;
      color: #a89080;
      letter-spacing: 0.04em;
      line-height: 1.5;
    }

    .card-arrow {
      font-size: 0.8rem;
      color: #c8b8a8;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="hero-dot"></div>
      <h1 class="hero-title">Still Space</h1>
      <p class="tagline">Take care of yourself first.</p>
    </header>

    <div class="cards">
      <a href="/workout" class="card card-w">
        <div class="card-icon">◈</div>
        <div class="card-body">
          <div class="card-title">Move</div>
          <div class="card-desc">10 min · today's workout changes daily</div>
        </div>
        <div class="card-arrow">&rarr;</div>
      </a>

      <a href="/meditation" class="card card-m">
        <div class="card-icon">✶</div>
        <div class="card-body">
          <div class="card-title">Meditate</div>
          <div class="card-desc">Guided sessions · 3–4 minutes</div>
        </div>
        <div class="card-arrow">&rarr;</div>
      </a>

      <a href="/journal" class="card card-j">
        <div class="card-icon">✦</div>
        <div class="card-body">
          <div class="card-title">Mirror</div>
          <div class="card-desc">Gratitude · scripting · self-inquiry</div>
        </div>
        <div class="card-arrow">&rarr;</div>
      </a>
    </div>
  </div>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef8f0"/>
      <stop offset="100%" stop-color="#f5ede0"/>
    </radialGradient>
    <radialGradient id="orb" cx="38%" cy="35%" r="62%">
      <stop offset="0%" stop-color="#fff8f0" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#d4a070" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#b07840" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#b07840" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Outer glow halo -->
  <circle cx="256" cy="256" r="148" fill="#c4956a" opacity="0.10" filter="url(#glow)"/>

  <!-- Main orb -->
  <circle cx="256" cy="256" r="118" fill="url(#orb)" filter="url(#softshadow)"/>

  <!-- Inner highlight -->
  <circle cx="226" cy="226" r="48" fill="white" opacity="0.22"/>

  <!-- Tiny centre dot -->
  <circle cx="256" cy="256" r="7" fill="#8a6030" opacity="0.35"/>
</svg>

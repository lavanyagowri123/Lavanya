<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Still Space</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf5ef;
      --text: #f0e8dc;
      --muted: #9a8070;
      --accent: #c4956a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: #2c1f14;
      font-family: 'Georgia', 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      position: fixed;
      inset: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.75s ease;
    }
    .screen.active { opacity: 1; pointer-events: all; }

    /* ---- MENU ---- */
    #menu-screen { padding: 0 0 56px; }
    .menu-hero { text-align: center; padding: 60px 24px 44px; }
    .hero-dot { width: 7px; height: 7px; background: #c4956a; border-radius: 50%; margin: 0 auto 22px; opacity: 0.5; }
    .menu-hero h1 { font-size: 1.8rem; font-weight: normal; letter-spacing: 0.22em; color: #8a6218; margin-bottom: 10px; }
    .menu-hero p { font-size: 0.75rem; letter-spacing: 0.16em; color: #a89070; text-transform: uppercase; }
    .cards { display: flex; flex-direction: column; gap: 12px; padding: 0 16px; }
    .section-label { font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase; color: #a89070; padding: 0 4px; margin-bottom: 2px; }
    .section-label-other { margin-top: 8px; }
    .card { border-radius: 20px; padding: 22px 20px 20px; cursor: pointer; border: 1px solid transparent; transition: transform 0.15s ease, opacity 0.15s ease; }
    .card-today { border-width: 1.5px; }
    .card:active { transform: scale(0.974); opacity: 0.88; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
    .card-title { font-size: 1.05rem; font-weight: normal; letter-spacing: 0.02em; line-height: 1.3; }
    .card-dur { font-size: 0.66rem; letter-spacing: 0.1em; color: #a89070; padding-top: 3px; white-space: nowrap; margin-left: 10px; }
    .card-tag { font-size: 0.63rem; letter-spacing: 0.13em; text-transform: uppercase; opacity: 0.45; margin-bottom: 10px; }
    .card-desc { font-size: 0.8rem; line-height: 1.65; color: #a89070; }

    /* ---- MEDITATION ---- */
    #med-screen { background: var(--bg); overflow: hidden; }
    .med-header {
      display: flex; align-items: center; gap: 12px;
      padding: 22px 20px 16px;
      flex-shrink: 0;
      background: inherit;
    }
    .btn-back {
      background: none; border: 1px solid rgba(44,31,20,0.15);
      color: rgba(44,31,20,0.35); border-radius: 50%;
      width: 36px; height: 36px; font-size: 1rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: color 0.2s, border-color 0.2s;
      -webkit-appearance: none; line-height: 1;
    }
    .btn-back:active { color: #2c1f14; border-color: rgba(44,31,20,0.4); }
    .med-meta { flex: 1; min-width: 0; }
    .med-meta h2 { font-size: 0.88rem; font-weight: normal; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .med-meta span { font-size: 0.66rem; color: var(--muted); letter-spacing: 0.08em; }
    .prog-wrap { height: 1px; background: rgba(44,31,20,0.1); margin: 0 20px; }
    .prog-fill { height: 100%; width: 0%; transition: width 0.8s linear; }
    /* ---- ORB ---- */
    .orb-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 38px;
    }

    .orb {
      width: min(200px, 52vw);
      height: min(200px, 52vw);
      border-radius: 50%;
      background: radial-gradient(circle at 38% 36%,
        rgba(255,255,255,0.68) 0%,
        var(--orb-mid) 48%,
        var(--orb-accent) 100%);
      box-shadow:
        0 0 56px 22px var(--orb-glow),
        0 0 110px 50px var(--orb-glow-far);
      animation: breathe 8s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1);    }
      50%       { transform: scale(1.22); }
    }

    .orb-labels { position: relative; height: 18px; }
    .orb-lbl {
      position: absolute;
      left: 50%; transform: translateX(-50%);
      font-size: 0.63rem; letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(44,31,20,0.35);
      white-space: nowrap;
    }
    #lbl-in  { animation: lbl-in  8s ease-in-out infinite; }
    #lbl-out { animation: lbl-out 8s ease-in-out infinite; }

    @keyframes lbl-in {
      0%, 35%  { opacity: 0.65; }
      45%, 90% { opacity: 0;    }
      100%     { opacity: 0.65; }
    }
    @keyframes lbl-out {
      0%, 45%  { opacity: 0;    }
      55%, 90% { opacity: 0.65; }
      100%     { opacity: 0;    }
    }

    .orb-area.paused .orb,
    .orb-area.paused .orb-lbl { animation-play-state: paused; }

    .controls {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      gap: 40px;
      padding: 16px 36px 40px;
      border-top: 1px solid rgba(44,31,20,0.07);
      background: inherit;
    }
    .btn-ctrl {
      background: none; border: 1px solid rgba(44,31,20,0.14);
      color: rgba(44,31,20,0.4); border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease; -webkit-appearance: none;
    }
    .btn-ctrl:active { background: rgba(44,31,20,0.06); }
    .btn-ctrl.lit { border-color: rgba(44,31,20,0.35); color: rgba(44,31,20,0.75); background: rgba(44,31,20,0.05); }
    .btn-sound { width: 44px; height: 44px; font-size: 1.05rem; }
    .btn-pause { width: 62px; height: 62px; font-size: 1.5rem; }

    /* ---- CLOSING ---- */
    #closing-screen { align-items: center; justify-content: center; text-align: center; padding: 40px 32px; background: var(--bg); color: #2c1f14; }
    .closing-glyph { font-size: 2.4rem; color: #c4956a; margin-bottom: 32px; opacity: 0; transform: scale(0.75); transition: opacity 1.8s ease, transform 1.8s ease; }
    .closing-glyph.in { opacity: 0.6; transform: scale(1); }
    .closing-words { font-size: 1rem; line-height: 2.1; color: #a89070; max-width: 264px; opacity: 0; transition: opacity 1.8s ease 0.9s; }
    .closing-words.in { opacity: 1; }
    .btn-return {
      margin-top: 52px; background: none;
      border: 1px solid rgba(44,31,20,0.18);
      color: rgba(44,31,20,0.4);
      padding: 13px 34px; border-radius: 40px;
      font-family: inherit; font-size: 0.75rem;
      letter-spacing: 0.16em; text-transform: uppercase;
      cursor: pointer; opacity: 0;
      transition: opacity 1.8s ease 2.4s, color 0.2s, border-color 0.2s;
      -webkit-appearance: none;
    }
    .btn-return.in { opacity: 1; }
    .btn-return:active { color: #2c1f14; border-color: rgba(44,31,20,0.4); }

  </style>
</head>
<body>


<!-- MENU -->
<div id="menu-screen" class="screen active">
  <div class="menu-hero">
    <div class="hero-dot"></div>
    <h1>Still Space</h1>
    <p>Choose your practice</p>
  </div>
  <div class="cards" id="cards"></div>
</div>

<!-- MEDITATION -->
<div id="med-screen" class="screen">
  <div class="med-header">
    <button class="btn-back" id="btn-back">&#8592;</button>
    <div class="med-meta">
      <h2 id="med-name"></h2>
      <span id="med-dur"></span>
    </div>
  </div>
  <div class="prog-wrap"><div class="prog-fill" id="prog"></div></div>
  <div class="orb-area" id="orb-area">
    <div class="orb" id="orb"></div>
    <div class="orb-labels">
      <span class="orb-lbl" id="lbl-in">breathe in</span>
      <span class="orb-lbl" id="lbl-out">breathe out</span>
    </div>
  </div>
  <div class="controls">
    <button class="btn-ctrl btn-sound" id="btn-sound">🌧</button>
    <button class="btn-ctrl btn-pause" id="btn-pause">⏸</button>
  </div>
</div>

<!-- CLOSING -->
<div id="closing-screen" class="screen">
  <div class="closing-glyph" id="glyph">✶</div>
  <div class="closing-words" id="words">You did something kind<br>for yourself today.<br><br>Carry this stillness<br>with you.</div>
  <button class="btn-return" id="btn-return">Return</button>
</div>

<audio id="med-audio" preload="auto"></audio>

<script>
const MEDITATIONS = [
  { id:'grounding', title:'5-4-3-2-1 Grounding', tag:'Somatic · Sensory', desc:'Pulls you into the present moment through your senses. Good for anxiety spikes.', duration:'4 min',
    pal:{ bg:'linear-gradient(150deg,#fef6ec 0%,#faf5ef 100%)', cardBg:'#fdf3e6', border:'rgba(196,149,106,0.2)', accent:'#c4956a', bar:'#c4956a' },
    lines:['Find a comfortable position.','Gently close your eyes if that feels safe.','Take a slow, deep breath in.','And let it go.','...','We are going to anchor you in this moment.','Right here. Right now.','...','When you\'re ready, open your eyes softly.','Look around and silently name five things you can see.','A shape. A colour. A shadow. A texture. A light.','Take your time with each one.','...','Now notice four things you can physically feel.','The weight of your body being held.','The temperature of the air against your skin.','The sensation of your hands, wherever they rest.','Let each one ground you a little further.','...','Three things you can hear.','Listen past the obvious sounds.','Find something underneath — a hum, a rustle, a distant tone.','...','Two things you can smell.','Or simply notice the quality of air as it enters.','...','And one thing you can taste.','Even the faint taste of your own breath.','...','You are here.','Not in the past. Not in the future.','In this body. In this moment.','...','Take one more deep breath.','And as you exhale — let any tension dissolve.','You are safe. You are present.']
  },
  { id:'box', title:'Box Breathing', tag:'Breath · Body', desc:'Four counts in, hold, out, hold. No thinking required. Good for overwhelm.', duration:'3 min',
    pal:{ bg:'linear-gradient(150deg,#eef5fc 0%,#f0f5ff 100%)', cardBg:'#edf3fa', border:'rgba(107,158,200,0.2)', accent:'#6b9ec8', bar:'#6b9ec8' },
    lines:['Sit comfortably. Hands resting gently.','We\'ll breathe together in a simple rhythm.','Let your body lead. Your mind can rest.','...','Breathe in — two — three — four.','Hold — two — three — four.','Breathe out — two — three — four.','Hold — two — three — four.','...','Good.','...','Again — breathe in — two — three — four.','Hold — two — three — four.','Breathe out — two — three — four.','Hold — two — three — four.','...','Notice how your nervous system begins to soften.','...','Breathe in — two — three — four.','Hold — two — three — four.','Breathe out — two — three — four.','Hold — two — three — four.','...','One more round.','...','Breathe in — two — three — four.','Hold — two — three — four.','Breathe out — two — three — four.','Hold — two — three — four.','...','Let your breath return to its natural rhythm.','Feel the steadiness that is always here.','This rhythm belongs to you.']
  },
  { id:'fear', title:'Fear Release', tag:'Acknowledge · Breathe · Release', desc:'Name the fear, breathe through it, let it pass. For when the alarm fires.', duration:'4 min',
    pal:{ bg:'linear-gradient(150deg,#f2eefa 0%,#f5f2ff 100%)', cardBg:'#f0edf8', border:'rgba(155,126,200,0.2)', accent:'#9b7ec8', bar:'#9b7ec8' },
    lines:['Something has triggered the alarm inside you.','That\'s okay.','Fear is not your enemy.','It\'s a part of you trying to keep you safe.','...','Take a slow breath in.','And out.','...','Place one hand on your chest if you\'d like.','Feel your own heartbeat.','It\'s still here. You\'re still here.','...','Quietly, just to yourself — name what you\'re afraid of.','Don\'t push it away. Let it exist for a moment.','Give it a name.','...','Now breathe in — slowly.','And as you breathe out, imagine that fear as a colour or a shape.','Watch it as you exhale.','It doesn\'t have to leave. Just notice it.','...','Fear often tells a story about what might happen.','But right now, in this breath, you are okay.','...','Breathe in again.','And out.','...','You don\'t have to fight the fear.','You don\'t have to fix it right now.','You only have to breathe.','...','One more breath — long and slow.','And as you exhale — let it move through you.','Not stay. Move.','...','You are bigger than this feeling.','It will pass. And you will still be here.']
  },
  { id:'compassion', title:'Self Compassion Reset', tag:'Forgiveness · Kindness', desc:'For moments you\'ve snapped or fallen short. A gentle return to yourself.', duration:'4 min',
    pal:{ bg:'linear-gradient(150deg,#fceef4 0%,#fff0f8 100%)', cardBg:'#faedf3', border:'rgba(200,126,155,0.2)', accent:'#c87e9b', bar:'#c87e9b' },
    lines:['Something happened.','Maybe you said something you wish you hadn\'t.','Maybe you fell short of who you want to be.','...','I want you to take a breath before you do anything else.','Breathe in.','And out.','...','You are not a bad person.','You are a person who is tired, or overwhelmed, or scared.','And sometimes those feelings come out sideways.','...','If there\'s someone you\'ve hurt — you\'ll tend to that.','You already know you will.','But right now, we\'re tending to you.','...','Place your hand on your heart.','Feel the warmth of your own touch.','...','Breathe in — and silently say to yourself:','This is hard.','I am human.','I am doing my best.','...','Say it again, gently.','This is hard.','I am human.','I am doing my best.','...','You are allowed to be imperfect.','Growth is not a straight line.','The fact that this moment matters to you —','that is who you are.','...','Take one more breath.','And let yourself be held — in your own kindness.']
  },
  { id:'letgo', title:'Let It Go', tag:'Release · Open Hands', desc:'For when you\'re gripping an outcome. Loosen your hold, trust the unfolding.', duration:'4 min',
    pal:{ bg:'linear-gradient(150deg,#eef8f2 0%,#f2fcf5 100%)', cardBg:'#edf8f1', border:'rgba(126,200,155,0.2)', accent:'#7ec89b', bar:'#7ec89b' },
    lines:['There\'s something you\'re holding onto.','An outcome you\'ve been steering toward.','A result you need to go a certain way.','...','Take a breath.','And notice — where do you feel that grip in your body?','In your jaw? Your shoulders? Your chest?','...','Breathe in slowly.','And as you exhale, soften that place — just slightly.','Not letting go yet. Just softening.','...','Here is something true:','You have done what you can do.','You have shown up. You have tried.','...','The rest — the outcome, the response, the result —','lives outside your hands.','Holding it tightly doesn\'t change what will happen.','It only costs you peace.','...','If you\'d like — hold your hands out, palms up.','Imagine placing what you\'re holding into open palms.','Not throwing it away.','Just releasing your grip.','...','Breathe in.','And as you breathe out — open your hands.','Physically, if you can.','...','What happens is allowed to happen.','You are allowed to not know.','You are allowed to trust.','...','Take one more breath.','And let the future be what it will be.','You are here. That is enough.']
  }
];

const AUDIO_MAP = {
  grounding:  '/audio/grounding.mp3',
  box:        '/audio/box-breathing.mp3',
  fear:       '/audio/fear-release.mp3',
  compassion: '/audio/compassion.mp3',
  letgo:      '/audio/let-go.mp3'
};

/* ===== COMPLETION TRACKING ===== */
function getMelbDateISO() {
  return new Date().toLocaleDateString('sv', { timeZone: 'Australia/Melbourne' });
}
function _updateStreak(today) {
  try {
    const streak = JSON.parse(localStorage.getItem('stillspace_streak') || '{"count":0,"lastDate":""}');
    if (streak.lastDate === today) return;
    const prev = new Date(today + 'T12:00:00');
    prev.setDate(prev.getDate() - 1);
    const yesterday = prev.toLocaleDateString('sv', { timeZone: 'Australia/Melbourne' });
    const newCount = streak.lastDate === yesterday ? streak.count + 1 : 1;
    localStorage.setItem('stillspace_streak', JSON.stringify({ count: newCount, lastDate: today }));
  } catch(e) {}
}
function markDone(type) {
  try {
    const today = getMelbDateISO();
    let done = JSON.parse(localStorage.getItem('stillspace_done') || '{}');
    if (done.date !== today) done = { date: today, move: false, meditate: false, mirror: false };
    done[type] = true;
    localStorage.setItem('stillspace_done', JSON.stringify(done));
    if (done.move && done.meditate && done.mirror) _updateStreak(today);
  } catch(e) {}
}

/* ===== MELBOURNE DATE ===== */
function getMelbDate() {
  return new Date().toLocaleDateString('en-AU', { timeZone: 'Australia/Melbourne' });
}

/* ===== DAILY PICK ===== */
const TODAY_MEL = getMelbDate();
const savedMed = JSON.parse(localStorage.getItem('stillspace_med') || '{}');
let todayMed;
if (savedMed.date === TODAY_MEL) {
  todayMed = MEDITATIONS.find(m => m.id === savedMed.id) || MEDITATIONS[0];
} else {
  const pool = MEDITATIONS.filter(m => m.id !== savedMed.id);
  todayMed = pool[Math.floor(Math.random() * pool.length)];
  localStorage.setItem('stillspace_med', JSON.stringify({ date: TODAY_MEL, id: todayMed.id }));
}

/* ===== STATE ===== */
let cur = null, paused = false;
let soundOn = false, audioCtx = null, noiseGain = null;
let wakeLock = null;

const audioEl = document.getElementById('med-audio');

/* ===== WAKE LOCK ===== */
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && cur && !paused) requestWakeLock();
});

/* ===== SCREENS ===== */
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ===== AUDIO EVENTS ===== */
audioEl.addEventListener('timeupdate', () => {
  if (!cur) return;
  const dur = audioEl.duration;
  if (dur && dur > 0) {
    document.getElementById('prog').style.width = (audioEl.currentTime / dur * 100) + '%';
  }
});

audioEl.addEventListener('ended', finish);

/* ===== ORB COLOR HELPER ===== */
function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ===== START ===== */
function startMed(med) {
  cur = med; paused = false;

  const ms = document.getElementById('med-screen');
  ms.style.background = med.pal.bg;
  ms.style.setProperty('--orb-accent',   med.pal.accent);
  ms.style.setProperty('--orb-mid',      hexToRgba(med.pal.accent, 0.55));
  ms.style.setProperty('--orb-glow',     hexToRgba(med.pal.accent, 0.22));
  ms.style.setProperty('--orb-glow-far', hexToRgba(med.pal.accent, 0.09));

  document.getElementById('prog').style.background = med.pal.bar;
  document.getElementById('prog').style.width = '0%';
  document.getElementById('med-name').textContent = med.title;
  document.getElementById('med-dur').textContent = med.duration;
  document.getElementById('orb-area').classList.remove('paused');
  document.getElementById('btn-pause').textContent = '⏸';

  show('med-screen');
  requestWakeLock();

  audioEl.src = AUDIO_MAP[med.id];
  audioEl.currentTime = 0;
  const p = audioEl.play();
  if (p) p.catch(e => console.warn('Autoplay blocked:', e));
}

/* ===== PAUSE / RESUME ===== */
document.getElementById('btn-pause').addEventListener('click', () => {
  const orbArea = document.getElementById('orb-area');
  if (paused) {
    paused = false;
    document.getElementById('btn-pause').textContent = '⏸';
    orbArea.classList.remove('paused');
    audioEl.play();
  } else {
    paused = true;
    document.getElementById('btn-pause').textContent = '▶';
    orbArea.classList.add('paused');
    audioEl.pause();
    releaseWakeLock();
  }
});

/* ===== BACK ===== */
document.getElementById('btn-back').addEventListener('click', () => {
  audioEl.pause();
  audioEl.src = '';
  paused = false; cur = null;
  document.getElementById('orb-area').classList.remove('paused');
  releaseWakeLock();
  show('menu-screen');
});

/* ===== FINISH ===== */
function finish() {
  audioEl.pause();
  releaseWakeLock();
  markDone('meditate');
  show('closing-screen');
  setTimeout(() => document.getElementById('glyph').classList.add('in'), 350);
  setTimeout(() => document.getElementById('words').classList.add('in'), 1200);
  setTimeout(() => document.getElementById('btn-return').classList.add('in'), 2800);
}

document.getElementById('btn-return').addEventListener('click', () => {
  ['glyph', 'words', 'btn-return'].forEach(id => document.getElementById(id).classList.remove('in'));
  buildMenu(); show('menu-screen');
});

/* ===== AMBIENT RAIN ===== */
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const sr  = audioCtx.sampleRate;
  const buf = audioCtx.createBuffer(1, sr * 4, sr);
  const d   = buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for (let i = 0; i < d.length; i++) {
    const w = Math.random() * 2 - 1;
    b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
    b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
    b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
    d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)/9.5; b6=w*0.115926;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf; src.loop = true;
  const lpf = audioCtx.createBiquadFilter();
  lpf.type = 'lowpass'; lpf.frequency.value = 480;
  noiseGain = audioCtx.createGain(); noiseGain.gain.value = 0;
  src.connect(lpf); lpf.connect(noiseGain); noiseGain.connect(audioCtx.destination);
  src.start();
}

document.getElementById('btn-sound').addEventListener('click', () => {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  soundOn = !soundOn;
  noiseGain.gain.setTargetAtTime(soundOn ? 0.14 : 0, audioCtx.currentTime, 0.9);
  const btn = document.getElementById('btn-sound');
  btn.classList.toggle('lit', soundOn);
  btn.textContent = soundOn ? '🔊' : '🌧';
});

/* ===== MENU ===== */
function makeCard(med, isToday) {
  const el = document.createElement('div');
  el.className = 'card' + (isToday ? ' card-today' : '');
  const border = isToday ? hexToRgba(med.pal.accent, 0.42) : med.pal.border;
  el.style.cssText = `background:${med.pal.cardBg};border-color:${border};`;
  el.innerHTML = `<div class="card-top"><div class="card-title" style="color:${med.pal.accent}">${med.title}</div><div class="card-dur">${med.duration}</div></div><div class="card-tag" style="color:#a89070;opacity:1">${med.tag}</div><div class="card-desc">${med.desc}</div>`;
  el.addEventListener('click', () => startMed(med));
  return el;
}

function label(text, extra) {
  const el = document.createElement('div');
  el.className = 'section-label' + (extra ? ' ' + extra : '');
  el.textContent = text;
  return el;
}

function buildMenu() {
  const c = document.getElementById('cards');
  c.innerHTML = '';
  c.appendChild(label("today's practice"));
  c.appendChild(makeCard(todayMed, true));
  c.appendChild(label('or choose another', 'section-label-other'));
  MEDITATIONS.filter(m => m.id !== todayMed.id).forEach(m => c.appendChild(makeCard(m, false)));
}

buildMenu();
</script>
</body>
</html>
